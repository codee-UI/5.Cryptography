<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Symmetric & Asymmetric Lab</title>
<style>
:root{--bg:#eef2f6;--p:#fff;--ink:#14202b;--mu:#566574;--ac:#0a7d6e;--ac2:#1d4ed8;--bad:#c2410c;--ok:#15803d;--bd:#cbd5df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1720;--p:#17222e;--ink:#e6edf3;--mu:#93a4b4;--ac:#2dd4bf;--ac2:#7aa2ff;--bad:#fb923c;--ok:#4ade80;--bd:#2b3b4a;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif}
h1,h2,h3,button,input,.mono,nav{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
nav{background:var(--p);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:18px;margin:4px 8px 12px}nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:6px;font-size:14px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}nav button:hover:not(.on){background:var(--bg)}
main{padding:24px;max-width:980px;width:100%}h2{margin:0 0 6px;font-size:26px}.sum{color:var(--mu);max-width:70ch}
.card{background:var(--p);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:16px 0}
#flow{position:relative;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:26px}
.node{border:2px solid var(--bd);border-radius:8px;padding:10px 14px;font:600 14px system-ui;transition:.4s;background:var(--bg)}
.node.done{border-color:var(--ac);color:var(--ac)}.node.on{background:var(--ac);color:#fff;border-color:var(--ac);transform:translateY(-4px)}
.ar{color:var(--mu)}.pkt{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--bad);transition:transform .7s cubic-bezier(.5,0,.2,1);top:0;left:0}
.ctl{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button.b{background:var(--ac2);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:14px}button.b:focus-visible,nav button:focus-visible,input:focus-visible{outline:3px solid var(--bad);outline-offset:2px}
#say{font-size:17px;margin-top:12px;min-height:3.2em}ol.st{padding-left:22px;margin:8px 0}ol.st li{padding:3px 0;cursor:pointer;color:var(--mu)}ol.st li.on{color:var(--ink);font-weight:bold}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.g3 h3{margin:0 0 6px;font-size:15px}.g3 ul{margin:0;padding-left:18px}.pro h3{color:var(--ok)}.con h3{color:var(--bad)}.ap h3{color:var(--ac2)}
input[type=text],input:not([type]),input[type=search]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--ink);font-size:15px}
.mono{font:13px ui-monospace,Menlo,monospace;word-break:break-all;margin:6px 0}.grid256{display:grid;grid-template-columns:repeat(32,1fr);gap:2px;margin:8px 0}.grid256 i{aspect-ratio:1;background:var(--bd);border-radius:2px;transition:.3s}.grid256 i.d{background:var(--bad)}
.verdict{font:700 16px system-ui;margin:8px 0}.ok{color:var(--ok)}.no{color:var(--bad)}
table{border-collapse:collapse;font:13px system-ui;width:100%}td,th{border-bottom:1px solid var(--bd);padding:5px 8px;text-align:left}.scroll{overflow-x:auto}
.q td{text-align:center;min-width:26px}.q td.h{text-align:left;font-weight:600}.q td[data-c]{opacity:0;transition:opacity .3s}.q td.sh{opacity:1}.q .keep{background:color-mix(in srgb,var(--ok) 25%,transparent)}.q .err{background:color-mix(in srgb,var(--bad) 40%,transparent)}
.bar{height:12px;background:var(--ac);border-radius:6px;width:0;transition:width 1s}.chip{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}.lab{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0;font:14px system-ui}
.freq{display:flex;align-items:flex-end;gap:2px;height:60px}.freq div{flex:1;background:var(--ac2);font:9px system-ui;color:var(--mu);text-align:center;transition:height .3s}
@media(max-width:760px){.wrap{display:block}nav{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--bd)}nav h1{display:none}nav button{white-space:nowrap;width:auto}.g3{grid-template-columns:1fr}.grid256{grid-template-columns:repeat(16,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>
const D=[
{id:"sym",t:"Symmetric encryption (same key)",w:"sym",
 sum:"One shared secret key encrypts and decrypts; decryption is the mirror image of encryption. Fast, but the key must reach both parties safely and the number of keys explodes as users grow.",
 flow:["Plaintext","Encrypt (key K)","Ciphertext","Decrypt (same K)","Plaintext"],
 steps:["Alice and Bob agree on a key K. It must travel out-of-band (courier, phone, fax), never on the same channel as the data, or a machine-in-the-middle (MITM) copies it.","Alice encrypts the plaintext with K.","The ciphertext crosses the untrusted network; without K it is unreadable.","Bob decrypts with the same K, running the steps in reverse.","Limits: anyone holding K can also change the message, so origin is unprovable (weak authenticity); every pair or group needs its own key: n(n−1)/2 keys, so 1,000 staff need 499,500."],
 pros:["Very fast; ideal for bulk data","Simple and hardware-friendly","Strong with long keys (AES-256)"],
 cons:["Key distribution is hard","Key count grows as n(n−1)/2","No nonrepudiation: shared key means anyone could have written it"],
 apps:["Disk and backup encryption (BitLocker, FileVault)","IPsec VPNs, TLS data channel","Wi-Fi (WPA2/3 with AES)","Military radio links, card payment PIN blocks"]},
{id:"stream",t:"Stream ciphers (keystream XOR)",w:"stream",
 sum:"A key seeds a keystream generator; each plaintext bit or byte is XORed with the matching keystream bit as it flows. Quick and low-latency, so it suits voice and hardware.",
 flow:["Key","Keystream generator","Keystream","XOR with plaintext","Ciphertext"],
 steps:["A fixed-length key (e.g. 10110111) is the secret.","The keystream generator expands it into a pseudorandom bit stream. Sender and receiver must get identical streams, so it cannot be truly random.","Keystream bits are produced continuously, one symbol at a time.","Each plaintext bit is XORed with a keystream bit (same bits → 0, different → 1).","Ciphertext is sent. Receiver XORs again with the same keystream to recover plaintext. Any generator eventually repeats, so messages must be shorter than the repeat interval."],
 pros:["Encrypts symbol by symbol with minimal delay","Easy to build in hardware","Errors do not spread to other blocks"],
 cons:["Reusing a keystream is catastrophic","Keystream repeat limits message length","RC4 is banned by NIST for federal sensitive data"],
 apps:["Voice calls (GSM A5, VoIP)","RC4 in WEP and early WPA","Bluetooth E0, ChaCha20 in modern TLS and Signal","Satellite and military link encryptors"]},
{id:"block",t:"Block ciphers, modes & IV",w:"block",
 sum:"A block cipher encrypts a whole fixed-size block per operation (AES: 128 bits). Modes decide how blocks combine: ECB, CBC for no-latency-concern data; CFB, OFB, CTR to imitate a stream cipher. An initialization vector (IV) adds variance.",
 flow:["Split into blocks","Pick mode","Apply IV / chaining","Encrypt blocks","Ciphertext blocks"],
 steps:["Long messages are cut into blocks (padding the last one).","ECB and CBC suit data where latency is not a concern; CFB, OFB and CTR work like stream ciphers when latency matters.","The IV (non-secret nonce, a number used once) starts the chain and synchronizes both ends.","ECB encrypts each block alone (equal blocks give equal output); CBC XORs each plaintext block with the previous ciphertext block; CTR XORs with the encrypted counter.","Rounds of substitution and transposition scramble each block. Try the modes below and watch repeated blocks."],
 pros:["More robust than most stream designs","Many modes fit many needs","CTR/GCM allow parallelism"],
 cons:["Latency: must wait for a full block","ECB leaks patterns","IV reuse breaks security"],
 apps:["AES-CBC/GCM in TLS and disk encryption","Database field encryption","CTR in Wi-Fi CCMP","Secure file storage in cloud services"]},
{id:"symalgos",t:"Symmetric algorithm catalogue",w:"symalgos",
 sum:"DES, 3DES, AES (Rijndael), IDEA, CAST, SAFER, Blowfish, Twofish, RC4, RC5, MARS and Serpent differ in key size, block size, rounds and survival.",
 flow:["DES / 3DES","AES (Rijndael)","IDEA / CAST / SAFER","Blowfish / Twofish","RC4 / RC5"],
 steps:["DES: 64-bit key with every 8th bit parity, so 56 effective bits. Double DES fell; Triple DES (strength ~2^112 with two keys) soon fell too, so all DES variants were abandoned.","Rijndael supports 128/192/256-bit blocks and keys; AES fixes the block at 128 bits with 10, 12 or 14 rounds for 128/192/256-bit keys.","IDEA (Lai & Massey, 1991): 128-bit key, 64-bit blocks, 8 rounds. CAST-128 (Adams & Tavares, 1996): 40-128 bit keys, 12-16 rounds; CAST-256: 48 rounds. SAFER (Massey): patent-free, a variant in Bluetooth.","Blowfish (Schneier): keys 32-448 bits, 64-bit blocks, key-built S-boxes, fast but slow to rekey. Twofish: AES finalist, 128-bit blocks, 16 rounds.","RC4 (Rivest, 1987): stream cipher, 8-2048-bit key. RC5: key up to 2040 bits, up to 255 rounds, 16/32/64-bit words, four modes (RC5, CBC, CBC-Pad, CTS)."],
 pros:["AES, Twofish: fast and trusted","Wide choice, some patent-free","Blowfish/Twofish free to use"],
 cons:["DES/3DES retired","RC4 weak in practice and banned by NIST","Blowfish unsuitable where keys change often or on smart cards"],
 apps:["AES: governments, banks, Wi-Fi, HTTPS","3DES: legacy ATMs (being phased out)","Blowfish: password hashing (bcrypt)","SAFER variant: Bluetooth"]},
{id:"ccmp",t:"AES-CCMP: Wi-Fi security (WPA2/WPA3)",w:null,
 sum:"CCMP combines AES in counter mode (confidentiality) with CBC-MAC (integrity and origin). It replaced WEP/RC4 and TKIP and is mandatory in 802.11i Robust Security Networks.",
 flow:["Frame + header","RSN negotiation","MIC (CBC-MAC)","CTR encrypt","Receiver verifies"],
 steps:["A wireless packet has a MAC header and payload (MPDU).","Robust Security Network (RSN) negotiates algorithms between access point and client; AES-CCMP is mandatory (TKIP allowed for legacy).","CBC-MAC with a 128-bit AES key computes a message integrity code (MIC) over the payload and parts of the header: data-origin authentication and integrity.","CTR mode encrypts the payload with a 128-bit key and a 48-bit packet number (IV), which minimizes replay attack exposure.","Receiver decrypts, recomputes the MIC and checks the packet number: tampered or replayed frames are dropped. Defined in RFC 3610 and IEEE 802.11i."],
 pros:["Confidentiality plus integrity in one design","Protects header parts, not only payload","Replay-resistant"],
 cons:["Needs AES hardware for speed on old gear","Only as good as the Wi-Fi passphrase","Not a fix for weak endpoint security"],
 apps:["Home and enterprise Wi-Fi (WPA2/3)","Military and hospital wireless LANs","Public hotspots with WPA3","Industrial wireless sensors"]},
{id:"asym",t:"Asymmetric encryption (public / private key)",w:"asym",
 sum:"Two mathematically linked keys: the public key is shared, the private key stays secret. Public encrypts, private decrypts (confidentiality); private signs, public verifies (proof of origin, nonrepudiation).",
 flow:["Recipient makes key pair","Publish public key","Sender encrypts with public","Ciphertext travels","Recipient decrypts with private"],
 steps:["The recipient generates a key pair (usually by software or PKI, not by hand).","The public key is published (website, key server, certificate); the private key never leaves the owner.","The sender encrypts with the recipient’s public key: only the matching private key can open it.","The ciphertext crosses the untrusted channel with no prior secret exchange.","Only the private-key holder decrypts: confidentiality. Reverse use: encrypt with the sender’s private key and anyone can decrypt with the public key, proving origin."],
 pros:["No prior key exchange","Enables signatures and nonrepudiation","Supports confidentiality, integrity, authenticity, privacy and safety goals"],
 cons:["Many times slower than symmetric","Impractical for messages above roughly 64 KB","Needs PKI to trust public keys"],
 apps:["HTTPS key exchange and certificates","PGP / S/MIME email","Code signing and software updates","Government e-passports and e-ID"]},
{id:"trapdoor",t:"Trapdoor functions: factoring & discrete log",w:"trapdoor",
 sum:"Easy forward, infeasible backward. RSA relies on factoring the product of two large primes; ECC, ElGamal and Diffie-Hellman rely on the discrete logarithm problem.",
 flow:["Choose secret numbers","Compute forward (easy)","Publish result","Attacker reverses (hard)","Owner uses trapdoor"],
 steps:["Prime factoring: pick two primes hundreds of digits long. Discrete log: pick secret exponent n.","Forward: multiply the primes, or compute x = c·b^n by repeated multiplication. Fast.","The product / x becomes (part of) the public key.","Backward: factor the product, or solve for n. Millions of operations even for small numbers, tens of thousands of CPU-years for real sizes (botnets and GPUs parallelize the attack).","The key owner knows the secret that makes reversal easy: the trapdoor. Only RSA uses factoring; ECC, ElGamal, DH use discrete logs."],
 pros:["Security from a hard math problem","Public key can be derived from private easily"],
 cons:["Quantum computers (Shor) threaten both problems","Large keys needed (RSA 2048+, ECC 256)"],
 apps:["RSA: TLS certificates, signatures","ECC: Bitcoin, iMessage, TLS 1.3","DH: VPN and TLS key agreement","Post-quantum migration in banks and defense"]},
{id:"dh",t:"Diffie-Hellman session key on demand",w:"dh",
 sum:"Two parties compute the same symmetric session key without ever sending it, using public numbers and private exponents.",
 flow:["Agree p and g","Pick private a / b","Exchange public A / B","Compute shared secret","Use as symmetric key"],
 steps:["Public parameters p (prime) and g are known to everyone.","Alice picks secret a, Bob picks secret b.","Alice sends A = g^a mod p; Bob sends B = g^b mod p. Eve sees both.","Alice computes B^a mod p, Bob computes A^b mod p: identical value.","That value becomes the symmetric session key for fast bulk encryption. Eve would need the discrete log."],
 pros:["Solves key distribution","Forward secrecy with ephemeral keys"],
 cons:["Unauthenticated DH allows MITM; needs signatures or certificates","Weak parameters are breakable"],
 apps:["TLS, SSH, IPsec/IKE","Signal and WhatsApp","VPN gateways","Military link key agreement"]},
{id:"pki",t:"PKI, certificates & certificate authorities",w:null,
 sum:"A certificate binds an identity to a public key, signed by a certificate authority (CA). PKI is the system of CAs, servers, standards and software that creates, distributes and validates them.",
 flow:["Generate key pair","Send request to CA","CA verifies identity","CA issues certificate","Others verify & use"],
 steps:["The key pair is generated on a device or by an enterprise key server; the private key stays there.","The requester sends the public key, identity details and algorithm info to the CA.","The CA checks the identity. It registers the public key and information in its vault but never the private key.","The CA signs and returns a digital certificate that ties identity to public key.","Anyone who trusts the CA validates the certificate and can encrypt to the owner or verify their signatures. Public CAs are private companies; organizations can run their own private CAs."],
 pros:["Scales trust to billions of users","Standardized and built into OS and browsers"],
 cons:["Trust depends on CAs (compromised CAs are dangerous)","Revocation and expiry management is hard"],
 apps:["HTTPS websites","Corporate VPN and smart cards","Government e-ID, military CAC cards","Code signing, IoT device identity"]},
{id:"compare",t:"Symmetric vs asymmetric & hybrid use",w:"compare",
 sum:"Asymmetric solves distribution and adds signatures but is slow; symmetric is fast. Real systems combine them: asymmetric to agree on a key, symmetric to encrypt data.",
 flow:["Client hello","Verify certificate","Asymmetric key exchange","Session key shared","AES bulk data"],
 steps:["Client contacts the server.","Server presents a certificate; client validates it through PKI.","Client encrypts a session key with the server’s public key (or both use Diffie-Hellman).","Server decrypts with its private key: both hold the same session key. Availability benefits too, since encryption-backed access control resists denial-of-service and disruption.","Bulk data flows with fast symmetric encryption (AES)."],
 pros:["Speed of symmetric plus convenience of asymmetric","Provides confidentiality, integrity, authenticity, nonrepudiation"],
 cons:["Complexity: more moving parts to configure","Weak link in either half undermines the whole"],
 apps:["HTTPS/TLS everywhere","Banking and card payments","Secure messaging","Defense and satellite command links"]}];
const G=[["MITM","Machine-in-the-Middle (man-in-the-middle)","Attacker intercepting a channel"],["Out-of-band","Key sent over a different channel","Courier, phone or fax"],["XOR","Exclusive OR","Bit operation: equal bits give 0"],["IV","Initialization Vector","Non-secret nonce that starts encryption"],["Nonce","Number used once","Unique value, often the IV"],["DES","Data Encryption Standard","56-bit effective key, retired"],["2DES / 3DES","Double / Triple DES","DES applied repeatedly, retired"],["AES","Advanced Encryption Standard","128-bit block, 128/192/256-bit key"],["IDEA","International Data Encryption Algorithm","128-bit key, 64-bit block"],["CAST","Carlisle Adams and Stafford Tavares","Feistel cipher family"],["SAFER","Secure And Fast Encryption Routine","Patent-free block cipher"],["RC4/5/6","Rivest Cipher 4, 5, 6","Ron Rivest’s ciphers (RC4 stream)"],["MARS / Serpent","AES finalist ciphers","Alternative block ciphers"],["Feistel","Feistel network","Cipher design splitting a block in halves"],["S-box","Substitution box","Lookup table that scrambles bits"],["LFSR","Linear Feedback Shift Register","Simple keystream generator"],["ECB","Electronic Code Book","Each block encrypted independently"],["CBC","Cipher Block Chaining","Block XORed with previous ciphertext"],["CFB","Cipher Feedback","Stream mode from a block cipher"],["OFB","Output Feedback","Stream mode, keystream independent of data"],["CTR","Counter","Stream mode using an incrementing counter"],["CTS","Ciphertext Stealing","Same-length ciphertext for any input"],["WEP","Wired Equivalent Privacy","Old Wi-Fi security on RC4, broken"],["WPA / WPA2 / WPA3","Wi-Fi Protected Access","Wi-Fi security standards"],["CCMP","Counter Mode with CBC-MAC Protocol","AES-based Wi-Fi protection"],["TKIP","Temporal Key Integrity Protocol","Legacy Wi-Fi protocol"],["RSN","Robust Security Network","802.11i network negotiating algorithms"],["MIC","Message Integrity Code","Tag proving integrity and origin"],["MPDU","MAC Protocol Data Unit","Wi-Fi frame payload unit"],["IEEE / IETF","Institute of Electrical and Electronics Engineers / Internet Engineering Task Force","Standards bodies"],["FIPS","Federal Information Processing Standard","US government standard (FIPS 197 = AES)"],["RFC","Request for Comments","Internet standards document"],["NIST","National Institute of Standards and Technology","US standards body"],["PKI","Public-Key Infrastructure","Trust system for certificates"],["CA","Certificate Authority","Issues and signs certificates"],["RSA","Rivest-Shamir-Adleman","Prime-factoring public-key algorithm"],["ECC","Elliptic Curve Cryptography","Discrete-log on curves"],["DH","Diffie-Hellman(-Merkle)","Key agreement protocol"],["ElGamal","Taher ElGamal’s algorithm","Discrete-log encryption"],["DDoS","Distributed Denial of Service","Overload attack on availability"],["CPU / GPU","Central / Graphics Processing Unit","Hardware used in parallel attacks"],["Trapdoor function","Easy forward, hard backward","Basis of public-key crypto"],["IPsec / TLS","Internet Protocol Security / Transport Layer Security","Network encryption protocols"]];
const $=s=>document.querySelector(s),H=(s)=>s;
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const rnd=()=>crypto.getRandomValues(new Uint8Array(1))[0]/256;
let timer;
function nav(){const n=$('#nav');n.innerHTML='<h1>Symmetric & Asymmetric Lab</h1>'+D.map(m=>`<button data-id="${m.id}">${m.t}</button>`).join('')+'<button data-id="gl">Glossary of terms</button>';n.onclick=e=>{const id=e.target.dataset.id;if(id)open(id)}}
function open(id){clearInterval(timer);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id==id));scrollTo(0,0);
 if(id=='gl')return gloss();const m=D.find(x=>x.id==id);
 $('#main').innerHTML=`<h2>${m.t}</h2><p class=sum>${m.sum}</p><div class=card id=wd ${m.w?'':'hidden'}></div>
 <div class=card><div id=flow>${m.flow.map((n,i)=>`<div class=node>${n}</div>`).join('<span class=ar>›</span>')}<div class=pkt></div></div><div id=say></div>
 <div class=ctl><button class=b id=pl>Pause</button><button class=b id=pv>Back</button><button class=b id=nx>Next step</button></div>
 <h3>Working principle, step by step</h3><ol class=st>${m.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>
 <div class="g3"><div class="card pro"><h3>Pros</h3><ul>${m.pros.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card con"><h3>Cons</h3><ul>${m.cons.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card ap"><h3>Where it works today</h3><ul>${m.apps.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`;
 const nodes=[...document.querySelectorAll('.node')],lis=[...document.querySelectorAll('.st li')],pk=$('.pkt');let cur=0,play=true;
 const go=i=>{cur=(i+nodes.length)%nodes.length;nodes.forEach((n,k)=>{n.classList.toggle('on',k==cur);n.classList.toggle('done',k<cur)});lis.forEach((l,k)=>l.classList.toggle('on',k==cur));$('#say').textContent=m.steps[cur];const n=nodes[cur];pk.style.transform=`translate(${n.offsetLeft+n.offsetWidth/2-8}px,${n.offsetTop-20}px)`};
 lis.forEach((l,k)=>l.onclick=()=>go(k));$('#nx').onclick=()=>go(cur+1);$('#pv').onclick=()=>go(cur-1);
 $('#pl').onclick=e=>{play=!play;e.target.textContent=play?'Pause':'Play'};timer=setInterval(()=>play&&go(cur+1),2600);go(0);
 if(m.w)W[m.w]($('#wd'))}
function gloss(){$('#main').innerHTML=`<h2>Glossary of terms</h2><p class=sum>Full forms and plain meanings of every abbreviation used here.</p><div class=card><input type=search id=gq placeholder="Filter, e.g. SHA or quantum"><div class=scroll><table id=gt></table></div></div>`;
 const r=q=>$('#gt').innerHTML='<tr><th>Term</th><th>Full form</th><th>Meaning</th></tr>'+G.filter(g=>g.join(' ').toLowerCase().includes(q.toLowerCase())).map(g=>`<tr><td><b>${g[0]}</b></td><td>${g[1]}</td><td>${g[2]}</td></tr>`).join('');r('');$('#gq').oninput=e=>r(e.target.value)}
const W={};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const vis=s=>[...s].map(c=>c.charCodeAt(0)<32||c.charCodeAt(0)>126?'·':c).join('');
const xr=(s,k)=>[...s].map((c,i)=>String.fromCharCode(c.charCodeAt(0)^k.charCodeAt(i%k.length))).join('');
const hx=s=>[...s].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join(' ');
const mp=(b,e,m)=>{let r=1n;b%=m;while(e>0n){if(e&1n)r=r*b%m;b=b*b%m;e>>=1n}return r};
W.sym=el=>{el.innerHTML=`<div class=lab>Alice’s key: <input id=sk value="K3y!" style="max-width:130px"> Message: <input id=sm value="Meet at noon"></div><div class=lab>Bob’s key: <input id=bk value="K3y!" style="max-width:130px"> (change it to see a wrong key fail)</div><div class=mono id=so></div><div class=verdict id=sv></div><hr><div class=lab>Users n: <input type=range id=sn min=2 max=1000 value=6 style="max-width:260px"><b id=nv></b></div><div class=verdict id=kv></div><svg id=kg viewBox="0 0 200 200" width=200 height=200></svg>`;
 const run=()=>{const k=$('#sk').value||'k',m=$('#sm').value,c=xr(m,k),d=xr(c,$('#bk').value||'k');$('#so').innerHTML=`Alice: “${esc(m)}” XOR key → ciphertext ${hx(c)}<br>Bob decrypts → “${esc(vis(d))}”`;$('#sv').innerHTML=d==m?'<span class=ok>Same key: decrypted correctly</span>':'<span class=no>Wrong key: gibberish</span>'};

W.asym=el=>{el.innerHTML=`<div class=lab>Primes (p,q): <select id=ap><option>61,53</option><option>101,113</option><option>211,227</option></select><label><input type=radio name=am value=c checked> Confidentiality (encrypt with public key)</label><label><input type=radio name=am value=s> Proof of origin (sign with private key)</label></div><input id=at value="Hi Bob"><div class=mono id=ao></div><div class=verdict id=av></div><small>Toy RSA with tiny primes, one character at a time. Real RSA uses 2048+ bit numbers and padding.</small>`;

 const isP=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i==0)return false;return true},rp=b=>{let n;do n=2**(b-1)+Math.floor(Math.random()*2**(b-1));while(!isP(n));return n},pw=(g,x,m)=>{let r=1,b=g%m;while(x>0){if(x&1)r=r*b%m;b=b*b%m;x=Math.floor(x/2)}return r};
 const run=()=>{const b=+$('#tb').value;$('#tv').textContent=b;let t=performance.now();const p=rp(b),q=rp(b),n=p*q,f=performance.now()-t;t=performance.now();let i=2;while(n%i)i++;const ft=performance.now()-t;const P=rp(b),x=Math.floor(P/2+Math.random()*P/2-1),y=pw(2,x,P);t=performance.now();let r=1,k=0;while(r!=y&&k<P){r=r*2%P;k++}const dt=performance.now()-t;
