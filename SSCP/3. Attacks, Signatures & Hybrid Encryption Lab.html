<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Attacks, Signatures & Hybrid Lab</title>
<style>
:root{--bg:#eef2f6;--p:#fff;--ink:#14202b;--mu:#566574;--ac:#0a7d6e;--ac2:#1d4ed8;--bad:#c2410c;--ok:#15803d;--bd:#cbd5df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1720;--p:#17222e;--ink:#e6edf3;--mu:#93a4b4;--ac:#2dd4bf;--ac2:#7aa2ff;--bad:#fb923c;--ok:#4ade80;--bd:#2b3b4a;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif}
h1,h2,h3,button,input,.mono,nav{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
nav{background:var(--p);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:18px;margin:4px 8px 12px}nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:6px;font-size:14px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}nav button:hover:not(.on){background:var(--bg)}
main{padding:24px;max-width:980px;width:100%}h2{margin:0 0 6px;font-size:26px}.sum{color:var(--mu);max-width:70ch}
.card{background:var(--p);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:16px 0}
#flow{position:relative;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:26px}
.node{border:2px solid var(--bd);border-radius:8px;padding:10px 14px;font:600 14px system-ui;transition:.4s;background:var(--bg)}
.node.done{border-color:var(--ac);color:var(--ac)}.node.on{background:var(--ac);color:#fff;border-color:var(--ac);transform:translateY(-4px)}
.ar{color:var(--mu)}.pkt{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--bad);transition:transform .7s cubic-bezier(.5,0,.2,1);top:0;left:0}
.ctl{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button.b{background:var(--ac2);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:14px}button.b:focus-visible,nav button:focus-visible,input:focus-visible{outline:3px solid var(--bad);outline-offset:2px}
#say{font-size:17px;margin-top:12px;min-height:3.2em}ol.st{padding-left:22px;margin:8px 0}ol.st li{padding:3px 0;cursor:pointer;color:var(--mu)}ol.st li.on{color:var(--ink);font-weight:bold}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.g3 h3{margin:0 0 6px;font-size:15px}.g3 ul{margin:0;padding-left:18px}.pro h3{color:var(--ok)}.con h3{color:var(--bad)}.ap h3{color:var(--ac2)}
input[type=text],input:not([type]),input[type=search]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--ink);font-size:15px}
.mono{font:13px ui-monospace,Menlo,monospace;word-break:break-all;margin:6px 0}.grid256{display:grid;grid-template-columns:repeat(32,1fr);gap:2px;margin:8px 0}.grid256 i{aspect-ratio:1;background:var(--bd);border-radius:2px;transition:.3s}.grid256 i.d{background:var(--bad)}
.verdict{font:700 16px system-ui;margin:8px 0}.ok{color:var(--ok)}.no{color:var(--bad)}
table{border-collapse:collapse;font:13px system-ui;width:100%}td,th{border-bottom:1px solid var(--bd);padding:5px 8px;text-align:left}.scroll{overflow-x:auto}
.q td{text-align:center;min-width:26px}.q td.h{text-align:left;font-weight:600}.q td[data-c]{opacity:0;transition:opacity .3s}.q td.sh{opacity:1}.q .keep{background:color-mix(in srgb,var(--ok) 25%,transparent)}.q .err{background:color-mix(in srgb,var(--bad) 40%,transparent)}
.bar{height:12px;background:var(--ac);border-radius:6px;width:0;transition:width 1s}.chip{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}.lab{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0;font:14px system-ui}
.freq{display:flex;align-items:flex-end;gap:2px;height:60px}.freq div{flex:1;background:var(--ac2);font:9px system-ui;color:var(--mu);text-align:center;transition:height .3s}
@media(max-width:760px){.wrap{display:block}nav{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--bd)}nav h1{display:none}nav button{white-space:nowrap;width:auto}.g3{grid-template-columns:1fr}.grid256{grid-template-columns:repeat(16,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>
const D=[
{id:"nonrep",t:"Nonrepudiation: signatures vs HMAC vs audit trail",w:"nr",
 sum:"Nonrepudiation means no party can deny taking part in a transaction. It needs verifiable proof of origin, identity and content. Digital signatures with certificates provide it; HMACs and audit trails help but do not.",
 flow:["Transaction","Evidence created","Dispute: “I never sent it”","Evidence checked","Verdict"],
 steps:["Two parties exchange a message, contract or payment with no physical signatures or witnesses.","Evidence is produced: a digital signature (private key), an HMAC (shared key) or an audit-trail entry (time, source, destination, content).","One side repudiates, the opposite of nonrepudiation. Deniability lets a party disown it without any proof; accountability makes them answer for it with evidence.","Only a private key held by one person can have produced a signature, so the certificate binds the act to that identity. A shared HMAC key could come from either side, and logs only trace origin.","Signature: sender cannot deny, receiver cannot claim a forgery. HMAC: integrity and origin, no nonrepudiation. Audit trail: chronology and tracing, no nonrepudiation."],
 pros:["Prevents disputes, fraud and tampering","Legally admissible proof of origin, identity, content","Builds trust in e-commerce, banking, healthcare, government"],
 cons:["Depends on private-key secrecy","Needs certificates and a trusted CA","Strength limited by the algorithm and key length"],
 apps:["E-contracts and e-invoicing","Banking and payment authorisation","Healthcare e-prescriptions and records","Government filings, defense order authentication"]},
{id:"hmac",t:"HMAC (hash-based message authentication code)",w:"hmac",
 sum:"A secret key and a hash function produce a fixed-length tag attached to the message. It proves integrity and that the sender knew the shared key, but not who of the two key holders sent it.",
 flow:["Shared secret key","Compute HMAC tag","Send message + tag","Receiver recomputes","Compare tags"],
 steps:["Sender and receiver share a secret key (SHA-256 or another secure hash underneath).","The sender hashes message and key together to a fixed-length tag.","Message and tag travel together over the untrusted channel.","The receiver computes the HMAC of the received message with their copy of the key.","Equal tags mean untampered and sent by a key holder. Because both parties hold the key, either could have made the tag: no nonrepudiation."],
 pros:["Fast, symmetric-key speed","Integrity and origin authentication","Simple to implement"],
 cons:["No nonrepudiation (shared key)","Key distribution problem remains","MD5-based HMACs are discouraged"],
 apps:["TLS record protection, IPsec ESP/AH","API request signing (cloud services)","JWT tokens (HS256)","Military link authentication, SecurID-style tokens"]},
{id:"audit",t:"Audit trails",w:"audit",
 sum:"An audit trail records events of a transaction: time, date, source, destination and content. It cannot prove who is responsible, but it traces origins and establishes chronology for investigations.",
 flow:["Event occurs","Log entry written","Stored by parties","Dispute / investigation","Chronology rebuilt"],
 steps:["A message is sent, relayed, received or validated.","Each system logs time, date, source, destination and content reference.","Sender, receiver, intermediary and CA may each keep copies.","In a dispute the logs are collected as evidence.","Investigators order the events to reconstruct sequence and validity. Logs alone are not nonrepudiation since they can be incomplete or altered."],
 pros:["Supports forensics and compliance","Multiple independent copies add confidence"],
 cons:["Not proof of identity","Logs can be altered unless protected","Storage and privacy overhead"],
 apps:["SIEM and security operations centres","Bank transaction records","Hospital record-access logs","Defense command-and-control logging"]},
{id:"dsig",t:"Digital signatures & message encryption (S/MIME)",w:"dsig",
 sum:"A signature is the sender’s private-key encryption of the message digest: it gives authentication, nonrepudiation and integrity but not secrecy. Encryption gives confidentiality. They are independent and are often combined.",
 flow:["Alice: message","Hash H → Alice’s digest","Encrypt (E) with private key","Send message + signature","Bob: hash H and decrypt (D) with public key","Digests equal: Verified"],
 steps:["Alice (sender) writes the message.","The hash function H makes Alice’s digest, proving integrity.","E encrypts the digest with Alice’s private key: the digital signature (proves who sent it).","The message and signature travel to Bob; the message itself is not confidential.","Bob hashes the message himself (Bob’s digest) and decrypts the signature with Alice’s public key (Alice’s digest).","If both digests match: Verified. Using S/MIME on SMTP email adds encryption, since plain SMTP can be read by anyone en route."],
 pros:["Authentication, nonrepudiation, integrity together","Legally binding in the US, EU and many countries","Combines freely with encryption"],
 cons:["Signature alone does not hide content","Needs certificates/PKI","Order matters: sign-then-encrypt vs encrypt-then-sign"],
 apps:["Signed and encrypted email (S/MIME)","Software updates and code signing","Contracts and e-government","Blockchain smart contracts"]},
{id:"aesrsa",t:"AES vs RSA",w:"aesrsa",
 sum:"AES is a fast symmetric cipher chosen by NIST to replace DES and 3DES; RSA (1978) is the most widely used public-key algorithm, for keys and signatures.",
 flow:["1997 NIST call","Finalists compete","Rijndael wins","AES standard","RSA complements AES"],
 steps:["NIST asks for a successor to DES/3DES: at least as strong, larger block, faster in software, royalty-free, flexible.","Finalists: Rijndael, Serpent (Ross Anderson), MARS (IBM), RC6 (Rivest) and Twofish (Schneier).","Rijndael by Joan Daemen and Vincent Rijmen of Belgium wins.","AES: 128-bit block, 128/192/256-bit keys; no practical attack other than brute force (AES-256 brute force would take a billion years or more).","RSA (Rivest, Shamir, Adleman, MIT 1978) relies on factoring primes; keys of 2048 bits are default (OpenSSL, Windows), CA/Browser Forum minimum 3072 in some policies. RSA protects small items (keys, signatures); AES protects the bulk data."],
 pros:["AES: fast, no practical attacks, royalty-free","RSA: key exchange and signatures without shared secret"],
 cons:["AES: shared key must be distributed","RSA: slow, large keys, vulnerable to factoring advances, quantum, side channels, bad implementation"],
 apps:["AES: TLS, SSH, IPsec, WPA2, BitLocker, government secrets","RSA: SSL/TLS handshakes, PGP, S/MIME, PKI certificates","Banking, military and healthcare systems use both"]},
{id:"hybrid",t:"Hybrid encryption, digital envelope & session keys",w:"hybrid",
 sum:"Symmetric encryption protects the large message, asymmetric encryption protects the small symmetric key. The pair travels as a digital envelope, and the one-use key is a session key.",
 flow:["Make session key","Encrypt message (AES)","Encrypt key (RSA public)","Send digital envelope","Recipient opens, key discarded"],
 steps:["The sender generates a random symmetric session key used for one session only.","The large message is encrypted quickly with the symmetric algorithm.","The small key (128 to 4096 bits) is encrypted with the receiver’s public key.","Encrypted message and encrypted key are sent together: a digital envelope.","The receiver’s private key recovers the session key, which decrypts the message; the session key is then discarded. Reversing the asymmetric use (private key) adds proof of origin."],
 pros:["Fast bulk encryption plus easy key exchange","Fresh key every session limits damage of a leak"],
 cons:["Two algorithms to get right","Public-key trust still needs PKI"],
 apps:["HTTPS/TLS, SSH","PGP and S/MIME email","Hospital imaging transfer","Satellite and military data links"]},
{id:"iv",t:"Cryptanalysis & the initialization vector (WEP failure)",w:"iv",
 sum:"Cryptanalysis studies weaknesses in ciphers; it is a method, not a motive (pen testers, law enforcement, criminals). Predictability helps attackers, so a random IV makes similar messages encrypt differently.",
 flow:["Collect similar ciphertexts","Look for patterns","Exploit weak IV","Recover key/plaintext","Fix: random, long IV"],
 steps:["Organizations send many similar-format messages under one key.","A cryptanalyst compares them for similarities and differences.","Without a random IV, identical plaintext gives identical ciphertext; WEP’s RC4 IV was too short, so IVs repeated.","Repeated keystreams let attackers XOR two ciphertexts and cancel the key; WEP traffic was compromised.","A long random IV added to each message makes ciphertext substantially different even under the same key."],
 pros:["Cryptanalysis finds weaknesses before criminals do","IVs are cheap and effective"],
 cons:["Short or reused IVs destroy security","Predictable keys and patterns remain a risk"],
 apps:["Penetration testing and red teams","Standards evaluation (NIST competitions)","Wi-Fi upgrade from WEP to WPA2/3","Intelligence and counterintelligence"]},
{id:"attacks",t:"Cryptanalytic attack catalogue",w:"attacks",
 sum:"Attacks differ by what the attacker knows or controls: ciphertext only, known or chosen plaintext, chosen ciphertext, or the implementation and people around the algorithm.",
 flow:["Observe","Gather samples","Choose attack","Recover key/data","Defender counter"],
 steps:["Attacker identifies the target cryptosystem and what access they have.","They gather ciphertext, plaintext pairs, hashes or timing data.","They choose the attack matching their access (select one below to see its position).","They recover the key, plaintext or a forged message.","Defenders raise the work factor, add padding, salts, nonces, constant-time code and training."],
 pros:["Each attack suggests a specific defense","Knowing them guides algorithm choice"],
 cons:["New attacks keep appearing","Implementation attacks bypass strong math"],
 apps:["Security audits","Algorithm competitions (AES, SHA-3)","National security cryptanalysis","Vendor product testing"]},
{id:"pwd",t:"Password attacks, rainbow tables & clipping levels",w:"pwd",
 sum:"Systems store password hashes. Brute force, dictionary and rainbow-table attacks try to match them; salting defeats tables and clipping levels lock accounts after too many online failures.",
 flow:["Stolen hash file","Pick attack","Hash guesses","Match found?","Defense: salt + lockout"],
 steps:["Systems store only password hashes (e.g. a SAM file).","Brute force tries every combination; dictionary tries natural words and variants such as 0 for o, 3 for e, @ for a; rainbow tables look up precomputed hashes.","Each guess is hashed and compared with the stored hash.","A match reveals the password. Offline attacks on a copied file have no lockout.","Salt breaks table lookups; a clipping level (allowed wrong tries) stops online brute force; longer, complex passwords raise the work factor."],
 pros:["Hashing never stores plaintext","Clipping levels stop online guessing","Salt kills precomputed tables"],
 cons:["Weak words fall quickly","Offline attacks ignore lockouts","Lockouts can be abused for denial of service"],
 apps:["Operating system logins","Web application user stores","Bank online-banking lockouts","Enterprise directory services"]},
{id:"brute",t:"Brute force, work factor, GPUs & Moore’s Law",w:"brute",
 sum:"Brute force tries all keys. Work factor is the time or resources needed to defeat protection. GPUs and Moore’s Law keep eroding it, so “adequate” encryption must be reviewed.",
 flow:["Define key space","Guess rate","Time to search","Hardware improves","Re-evaluate strength"],
 steps:["Key space is 2^bits (DES 56 bits was eventually exhausted).","Rate: a CPU may take 48 hours on an 8-character mixed password; a modern GPU under 10 minutes thanks to many arithmetic logic units.","Expected time is about half the key space divided by the rate.","Moore’s Law: compute doubles roughly every 18 months (possibly slowing), so strength adequate today may not be later.","Adequate encryption is one whose work factor exceeds what the attacker wants to invest. Reassess length, complexity and multifactor authentication."],
 pros:["Gives a way to compare strength","Longer keys scale defense exponentially"],
 cons:["Only a rough estimate","Hardware and techniques improve over time"],
 apps:["Choosing AES-128 vs 256","Password policy design","Crypto-agility planning in banks and defense","Retiring DES, SHA-1, MD5"]},
{id:"birthday",t:"Birthday attack & hash collisions",w:"birthday",
 sum:"It is far easier to find any two messages with the same digest than to match one specific digest. Cost is about 2^(n/2) instead of 2^n, so digests must be twice as long as the desired work factor.",
 flow:["Generate messages","Hash each","Store digests","Collision found","Forged equal-hash message"],
 steps:["Attacker prepares many message variants.","Each is hashed to an n-bit digest.","Digests are stored and compared with all earlier ones.","After about 2^(n/2) tries two different messages share a digest.","The forged message passes integrity checks. Countermeasure: digest twice the work factor (SHA-1’s 160 bits gives only 2^80)."],
 pros:["Explains why 128-bit hashes are weak","Guides digest-length choice"],
 cons:["Real collisions broke MD5 and SHA-1","Needs attacker-controlled messages"],
 apps:["Forged certificates (MD5 attack)","Document signing safety","Hash selection in standards (SHA-256/3)","Blockchain hash design"]},
{id:"freq",t:"Frequency analysis",w:"freq",
 sum:"In a substitution cipher each letter maps to another, but language statistics survive. In English E, T, A, O, I, N are most common, so the commonest cipher letters are likely those.",
 flow:["Ciphertext","Count letters","Rank by frequency","Map to ETAOIN","Read the text"],
 steps:["Collect the ciphertext.","Count each letter.","Sort from most to least common.","Assign the most common cipher letters to E, T, A, O, I, N… and refine with word shapes.","The plaintext emerges. Works with other attacks; modern ciphers hide statistics."],
 pros:["Cheap to run, teaches cryptanalysis"],
 cons:["Needs enough text","Useless against modern block and stream ciphers"],
 apps:["Breaking classical ciphers (historic wartime codebreaking)","Puzzle and forensic analysis","Teaching","Detecting weak custom ciphers in audits"]},
{id:"replay",t:"Replay attack",w:"replay",
 sum:"The attacker captures a valid message and resends it. Without sequence numbers, nonces or timestamps the host processes duplicates.",
 flow:["Valid transaction","Attacker captures","Attacker resends","Receiver checks","Reject or process twice"],
 steps:["A legitimate payment is sent.","The attacker records the packet; it is authentic, so no key is needed.","The attacker sends the same packet again.","The receiver looks for a sequence verification code or fresh number.","With no check, the duplicate is processed (double charge). With a check, it is rejected. Wi-Fi CCMP’s 48-bit packet number does this."],
 pros:["Easy to defend with counters/nonces"],
 cons:["Needs state at the receiver","Clock sync for timestamps"],
 apps:["Payment protocols","Wi-Fi WPA2/3","Car key-fob rolling codes","Military command messages"]},
{id:"impl",t:"Implementation attacks: side-channel, fault, probing, reverse engineering",w:"side",
 sum:"The math can be sound while the product leaks. Implementation attacks measure timing and power, force errors, probe circuits, reverse engineer products or recover temporary files.",
 flow:["Target device","Observe / disturb","Collect leakage","Derive secret","Hardening"],
 steps:["Attacker obtains the device, software or access to the workstation.","Side-channel analysis passively watches power, emanation, timing; fault analysis forces errors; probing watches nearby circuitry or adds hardware.","Results are compared with known-good output; measurements correlate with key bits.","Reverse engineering found Netscape SSL’s random number generator too predictable, exposing IVs and nonces; undeleted temporary files may hold plaintext.","Defenses: constant-time code, shielding, tamper-resistant modules, strong RNGs, wiping temporary files."],
 pros:["Awareness drives secure hardware design"],
 cons:["Common because they ignore the algorithm","Hard to see in software testing"],
 apps:["Smart-card and HSM certification","Payment terminals","Military crypto modules (tamper resistance)","Secure boot hardware"]},
{id:"social",t:"Social engineering: RSA SecurID breach (2011)",w:null,
 sum:"Cryptosystems rely on people. Deception, coercion or bribery bypass the math; the 2011 RSA breach started with phishing and cost about US$66 million.",
 flow:["Phishing emails","Employee opens Excel file","Zero-day Flash exploit","Backdoor installed","Tokens compromised, replaced"],
 steps:["Two phishing emails target RSA employees.","One opens an attached Microsoft Excel spreadsheet.","The spreadsheet exploits a zero-day Adobe Flash flaw.","A backdoor gives the attacker access to the network.","Two-factor SecurID security was undermined, affecting several US defense contractors; RSA replaced all tokens (~US$66 million). Defense: constant awareness, training and education."],
 pros:["Training is cheap compared with breaches"],
 cons:["Humans are the greatest vulnerability","Advanced persistent threats are patient"],
 apps:["Security awareness programs","Phishing simulations","Defense contractor supply-chain security","Incident response planning"]},
{id:"quantum",t:"Quantum cryptanalysis & post-quantum cryptography",w:"quantum",
 sum:"Quantum cryptography uses physics to create and share keys. Quantum computing could break RSA and ECC (Shor’s algorithm) and weaken symmetric keys (Grover); post-quantum algorithms are being prepared.",
 flow:["Today: classical limits","Micius entanglement","Quantum computer?","Public keys at risk","Post-quantum migration"],
 steps:["RSA-250 (829 bits) was factored in 2019; larger keys remain impractical to attack classically.","Micius satellite (China, 2017) demonstrated entanglement over a space-to-ground link, a building block for key distribution; quantum cryptography is not yet used to encrypt or store data.","A practical quantum computer would be orders of magnitude more powerful than supercomputer arrays.","Then most current public-key systems would not withstand concerted attack; symmetric keys lose roughly half their bits.","Research on post-quantum cryptography (governments, military and the Open Quantum Safe project) prepares replacements; NIST has standardized lattice-based schemes."],
 pros:["Key distribution tamper evidence","Post-quantum algorithms run on classical machines"],
 cons:["Large quantum computers do not exist yet","Migration is slow and costly"],
 apps:["Government and defense planning (store-now-decrypt-later)","Bank crypto-agility programs","Quantum-secured links (Micius, fibre networks)","Open Quantum Safe prototypes"]},
{id:"hygiene",t:"Cryptographic hygiene",w:"hygiene",
 sum:"Practices that keep cryptosystems strong. Strength is hard to measure: bugs creep into complex systems like PKI, and luck can beat skill, so ongoing care matters.",
 flow:["Inventory","Update suites","Monitor threats","Manage keys","Use vetted libraries"],
 steps:["Inventory session keys, certificates and related materials; validate them.","Keep algorithm suites at the latest versions.","Watch threat intelligence for early signs of trouble.","Invest in key management and storage, especially for backup and archive keys.","Use validated libraries for authentication; forbid inventing your own cryptography."],
 pros:["Cheap relative to a breach","Keeps pace with new attacks"],
 cons:["Ongoing effort","Strength never certain: work factor is a rough estimate"],
 apps:["Banks and payment processors (PCI DSS audits)","Defense accreditation","Hospitals","Cloud providers"]}];
const G=[["HMAC","Hash-based Message Authentication Code","Keyed hash giving integrity and origin"],["MAC","Message Authentication Code","Short tag proving a message’s integrity"],["Nonrepudiation","Cannot deny involvement","Proof of origin, identity, content"],["Repudiation","Denying a transaction","Opposite of nonrepudiation"],["Deniability","Disowning without proof","Plausible denial"],["Accountability","Answerable with evidence","Liability for actions"],["Audit trail","Record of events","Time, source, destination, content"],["S/MIME","Secure/Multipurpose Internet Mail Extensions","Email signing and encryption"],["SMTP","Simple Mail Transfer Protocol","Plain email transport, no security"],["CA","Certificate Authority","Issues and signs certificates"],["PKI","Public-Key Infrastructure","Trust system for certificates"],["PGP","Pretty Good Privacy","Email/file encryption"],["AES","Advanced Encryption Standard","Rijndael subset, 128-bit block"],["Rijndael","Daemen + Rijmen cipher","AES winner"],["DES / 3DES","Data Encryption Standard / Triple DES","Retired ciphers"],["RSA","Rivest-Shamir-Adleman","Factoring-based public-key algorithm"],["RC6","Rivest Cipher 6","AES finalist"],["NIST","National Institute of Standards and Technology","US standards body"],["CBC","Cipher Block Chaining","Block chaining mode"],["CTR","Counter mode","Stream-like mode"],["GCM","Galois/Counter Mode","Authenticated encryption mode"],["CCM","Counter with CBC-MAC","Authenticated encryption mode"],["TLS / SSL","Transport Layer Security / Secure Sockets Layer","Web encryption"],["SSH","Secure Shell","Encrypted remote login"],["IPsec","Internet Protocol Security","Network-layer encryption"],["WPA2","Wi-Fi Protected Access 2","AES-CCMP Wi-Fi security"],["WEP","Wired Equivalent Privacy","Broken Wi-Fi security (RC4, short IV)"],["IV","Initialization Vector","Random starting value"],["OAEP","Optimal Asymmetric Encryption Padding","Random padding for RSA"],["PKCS #1","Public-Key Cryptography Standard 1","RSA standard (v2.1 defines OAEP)"],["SAM","Security Account Manager","Windows password file"],["Work factor","Effort to defeat protection","Time or resources"],["Clipping level","Threshold of acceptable errors","Lockout after N failed logins"],["Moore’s Law","Compute doubles about every 18 months","Erodes key strength"],["CPU / GPU / ALU","Central / Graphics Processing Unit / Arithmetic Logic Unit","GPUs excel at brute force"],["2FA","Two-Factor Authentication","Password plus token"],["APT","Advanced Persistent Threat","Patient, well-resourced attacker"],["Side-channel","Leak via timing, power, emanation","Implementation attack"],["Fault analysis","Forcing errors","Compare to good output"],["Birthday attack","Collision search","About 2^(n/2) work"],["Rainbow table","Precomputed hash lookup","Defeated by salt"],["Salt","Random per-password value","Added before hashing"],["Session key","One-session symmetric key","Discarded afterwards"],["Digital envelope","Encrypted message + encrypted key","Hybrid package"],["Hybrid encryption","Symmetric + asymmetric","Speed plus key exchange"],["Shor / Grover","Quantum algorithms","Break RSA/ECC; halve symmetric bits"],["PQC","Post-Quantum Cryptography","Algorithms safe against quantum attack"],["Micius","Chinese quantum satellite","2017 entanglement link"],["OQS","Open Quantum Safe","Academic-industry PQC project"],["PCI DSS","Payment Card Industry Data Security Standard","Card data rules"]];
const $=s=>document.querySelector(s),H=(s)=>s;
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const rnd=()=>crypto.getRandomValues(new Uint8Array(1))[0]/256;
let timer;
function nav(){const n=$('#nav');n.innerHTML='<h1>Attacks, Signatures & Hybrid Lab</h1>'+D.map(m=>`<button data-id="${m.id}">${m.t}</button>`).join('')+'<button data-id="gl">Glossary of terms</button>';n.onclick=e=>{const id=e.target.dataset.id;if(id)open(id)}}
function open(id){clearInterval(timer);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id==id));scrollTo(0,0);
 if(id=='gl')return gloss();const m=D.find(x=>x.id==id);
 $('#main').innerHTML=`<h2>${m.t}</h2><p class=sum>${m.sum}</p><div class=card id=wd ${m.w?'':'hidden'}></div>
 <div class=card><div id=flow>${m.flow.map((n,i)=>`<div class=node>${n}</div>`).join('<span class=ar>›</span>')}<div class=pkt></div></div><div id=say></div>

W.birthday=el=>{el.innerHTML=`<div class=lab>Digest size: <input type=range id=bb min=8 max=32 value=20 style="max-width:200px"><b id=bbv></b> bits <button class=b id=br>Find a collision</button></div><div id=bo2 class=mono></div>`;

 $('#br').onclick=()=>{const b=+$('#bb').value,seen=new Map();let n=0,a,c;for(;n<3e6;){const m='msg'+Math.random(),d=h32(m)>>>(32-b);n++;if(seen.has(d)){a=seen.get(d);c=m;break}seen.set(d,m)}const lg=x=>Math.max(2,Math.log10(x+1)/10*100);
  $('#bo2').innerHTML=`Collision after <b>${n.toLocaleString()}</b> hashes ≈ 2^${b/2}=${Math.round(2**(b/2)).toLocaleString()}.<br>Matching one specific digest would need about 2^${b} = ${(2**b).toLocaleString()} tries.<div style="background:var(--bd);border-radius:6px;margin:4px 0"><div class=bar style="width:${lg(n)}%;background:var(--bad)"></div></div><div style="background:var(--bd);border-radius:6px"><div class=bar style="width:${lg(2**b)}%;background:var(--ok)"></div></div><small>Red: birthday search, green: specific-target search (log scale). Digest twice the work factor: SHA-1’s 160 bits gives only 2^80.</small>`}};
W.freq=el=>{const EN='etaoinshrdlcumwfgypbvkjxqz';el.innerHTML=`<textarea id=fm rows=4 style="width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--bd);border-radius:6px;padding:8px">cryptography protects information by turning readable text into unreadable text and then back again. attackers study how often each letter appears because the statistics of a language survive a simple substitution. the letter e is the most common in english and a few other letters follow it closely.</textarea><div class=ctl><button class=b id=fn>New random substitution key</button><button class=b id=fg>Guess step by step</button></div><div class=mono id=fc></div><div class=freq id=ff></div><div class=mono id=fd></div>`;
 let key,cm;const nk=()=>{const a=[...'abcdefghijklmnopqrstuvwxyz'];for(let i=25;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}key=a};
 const run=()=>{const p=$('#fm').value.toLowerCase(),c=p.replace(/[a-z]/g,x=>key[x.charCodeAt(0)-97]),f={};c.replace(/[a-z]/g,x=>f[x]=(f[x]||0)+1);const r=Object.entries(f).sort((a,b)=>b[1]-a[1]);cm={};r.forEach((e,i)=>cm[e[0]]=EN[i]);$('#fc').textContent=c;const mx=r[0]?r[0][1]:1;$('#ff').innerHTML=r.map(e=>`<div style="height:${6+e[1]/mx*54}px">${e[0]}</div>`).join('');$('#fd').textContent='Rank by frequency: '+r.map(e=>e[0]).join('')+'  vs English: '+EN;return[p,c]};
 nk();run();$('#fn').onclick=()=>{nk();run()};$('#fm').oninput=run;
 $('#fg').onclick=()=>{const [p,c]=run();let k=0;const iv=setInterval(()=>{k++;const rk=Object.keys(cm).slice(0,k),d=c.replace(/[a-z]/g,x=>rk.includes(x)?cm[x].toUpperCase():'_'),ok=[...c].filter((x,i)=>/[a-z]/.test(x)&&cm[x]==p[i]).length,tot=[...c].filter(x=>/[a-z]/.test(x)).length;$('#fd').innerHTML=`Mapped ${k} most common cipher letters:<br>${esc(d)}<br>${Math.round(ok/tot*100)}% of letters correct (a short text only roughly follows English statistics; word shapes finish the job)`;if(k>=26)clearInterval(iv)},550)}};
W.replay=el=>{el.innerHTML=`<label class=lab><input type=checkbox id=rc checked> Receiver checks sequence numbers</label><div class=ctl><button class=b id=rs>Alice pays $100</button><button class=b id=rr>Attacker replays last packet</button></div><div class=verdict id=rb></div><div class=mono id=rl></div>`;
 let seq=0,last=0,bal=1000,pkt=null;const L=t=>$('#rl').innerHTML+=t+'<br>',show=()=>$('#rb').textContent=`Alice’s balance: $${bal}`;show();
 const recv=p=>{if($('#rc').checked&&p.s<=last){L(`Receiver: packet #${p.s} ≤ last seen #${last} → <span class=ok>REJECTED (replay)</span>`);return}last=p.s;bal-=p.a;L(`Receiver: packet #${p.s} → processed, $${p.a} debited`);show()};
 $('#rs').onclick=()=>{pkt={s:++seq,a:100};L(`Alice sends payment packet #${pkt.s} ($100)`);recv(pkt)};$('#rr').onclick=()=>{if(!pkt)return L('Nothing captured yet: send a payment first.');L('Attacker resends the captured packet unchanged');recv(pkt)}};
W.side=el=>{el.innerHTML=`<label class=lab><input type=checkbox id=sc> Constant-time comparison (defense)</label><div class=lab>Secret PIN: <input id=sp value=K7Q2M style="max-width:140px"><button class=b id=sr>Run timing attack</button></div><div class=mono id=so2></div><small>The naive check stops at the first wrong character, so a correct prefix takes measurably longer. The attacker reads the leaked time to recover the secret one position at a time.</small>`;
 $('#sr').onclick=()=>{const S=$('#sp').value.toUpperCase().slice(0,8),C='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',cst=$('#sc').checked;const tm=g=>{let t=0;for(let i=0;i<S.length;i++){t++;if(!cst&&g[i]!=S[i])break}return t+Math.random()*.3};let got='',pos=0;const iv=setInterval(()=>{if(pos>=S.length){clearInterval(iv);$('#so2').innerHTML+=got==S?'<span class=no>Secret recovered in '+S.length*36+' guesses instead of 36^'+S.length+'</span>':'<span class=ok>Attack failed: timing is the same for every guess</span>';return}let best='',bt=-1;for(const c of C){const t=tm((got+c).padEnd(S.length,'~'));if(t>bt){bt=t;best=c}}got+=best;pos++;$('#so2').innerHTML=`Recovered so far: <b>${got}</b> (position ${pos}, best time ${bt.toFixed(2)})<br>`},700)}};
W.quantum=el=>{const R=[["AES-128",128,64,"Grover halves"],["AES-256",256,128,"Grover halves"],["SHA-256 preimage",256,128,"Grover halves"],["RSA-2048",112,0,"Shor breaks"],["ECC-256",128,0,"Shor breaks"],["Lattice PQC (e.g. ML-KEM)",128,128,"Designed to resist"]];
 el.innerHTML=`<div class=ctl><button class=b id=qq>Switch on a large quantum computer</button></div><table>${R.map((r,i)=>`<tr><td><b>${r[0]}</b></td><td style="width:50%"><div class=bar id=qb${i} style="width:${r[1]/256*100}%"></div></td><td id=qt${i}>${r[1]} bits</td><td><small>${r[3]}</small></td></tr>`).join('')}</table><small>Effective security bits are standard estimates (my addition). RSA-250 (829 bits) was factored classically in 2019 but 2048-bit RSA is still safe from classical attack.</small>`;
 let on=false;$('#qq').onclick=()=>{on=!on;$('#qq').textContent=on?'Switch off':'Switch on a large quantum computer';R.forEach((r,i)=>{const v=on?r[2]:r[1];$('#qb'+i).style.width=Math.max(.5,v/256*100)+'%';$('#qb'+i).style.background=v<64?'var(--bad)':'var(--ac)';$('#qt'+i).textContent=v+' bits'})}};
W.hygiene=el=>{const I=[["Keep algorithm suites at the latest versions","Known-weak algorithms stay in use"],["Monitor threat intelligence and known exploits","You learn of problems after attackers do"],["Inventory and validate session keys and certificates","Expired or rogue certificates go unnoticed"],["Use proper key management for backup and archive keys","Backups become the weakest link"],["Only validated libraries for login, authentication, authorization","Home-grown mistakes ship to production"],["Forbid inventing your own cryptographic algorithms","Unreviewed designs fail quickly"]];
 el.innerHTML=`<div id=hy>${I.map((x,i)=>`<label class=lab><input type=checkbox data-i=${i}> ${x[0]}</label>`).join('')}</div><div style="background:var(--bd);border-radius:6px"><div class=bar id=hb2></div></div><div class=verdict id=hv2></div><small>Even with perfect hygiene the work factor is only a rough estimate: PKI is a complex system of systems where design errors creep in, and luck can beat skill in modified brute-force attacks.</small>`;
 const run=()=>{const c=[...el.querySelectorAll('input:checked')].map(x=>+x.dataset.i),n=c.length;$('#hb2').style.width=n/6*100+'%';$('#hb2').style.background=n<3?'var(--bad)':n<6?'var(--ac2)':'var(--ok)';$('#hv2').innerHTML=`Hygiene score ${n}/6`+(n<6?`<br><span class=no>Open risks: ${I.filter((x,i)=>!c.includes(i)).map(x=>x[1]).join('; ')}</span>`:'<br><span class=ok>All measures in place: keep repeating them.</span>')};
 el.querySelectorAll('input').forEach(i=>i.oninput=run);run()};
nav();open('nonrep');
</script></body></html>
