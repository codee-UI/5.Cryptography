const M=[
{id:'cia',t:'1 · Secure protocols & CIA',d:'Secure protocols plus encryption give Confidentiality, Integrity and Authenticity for data in transit and at rest. Online banking is the classic use case.',

s:[['C','B','TLS + certificate','Browser opens a TLS session. The bank certificate proves identity (Authenticity) and SSL/TLS stops eavesdropping and impersonation.'],
['C','B','AES(card, PIN)','Sensitive data is encrypted with a symmetric key (AES): only authorised parties can read it (Confidentiality).'],
['A','B','altered packet','An attacker modifies data in transit. The hash/MAC no longer matches, so the bank rejects it (Integrity).'],
['B','D','AES at rest','Server stores records encrypted with AES; keys live in an HSM/KMS. 3DES, RSA/ECC are older or special-purpose options.'],

{id:'tls',t:'2 · SSL / TLS',d:'TLS sits between the application layer and TCP/IP. Handshake layer (Handshake, Change Cipher Spec, Alert) negotiates; Record layer fragments, compresses (legacy), adds a MAC and encrypts. SSL is deprecated and banned by PCI DSS.',

['C','A','verify cert','Client checks the CA signature chain, validity period and revocation status.'],
['A','C','trusted ✔','Chain leads to a trusted root: the server identity is authenticated.'],
['C','S','pre-master secret','Client sends a secret encrypted with the server public key (or uses Diffie-Hellman). Asymmetric crypto is used only here.'],
['C','C','derive keys','Both sides compute the master secret, then symmetric session keys and MAC keys from the exchanged data.'],
['C','S','ChangeCipherSpec + Finished','Client announces: from now on everything is protected with the negotiated keys.'],

['S','C','Alert: close_notify','Alert sub-protocol signals errors or an orderly close.']],

{id:'hyb',t:'3 · Hybrid crypto, hash & HMAC',d:'Asymmetric crypto safely shares a key; symmetric crypto encrypts the bulk data. Hashes give integrity; HMAC adds a shared secret for proof of origin.',
n:[['A','Sender',90,100],['B','Receiver',710,100],['M','Attacker',400,240,1]],
s:[['A','A','digest = H(msg)','A hash algorithm (agreed in handshake) creates a fixed-size digest of the entire message.'],
['A','A','HMAC = H(msg + secret)','A second shared secret is mixed into the hash, giving integrity AND basic proof of origin.'],
['A','B','session key (RSA/DH)','Asymmetric encryption or Diffie-Hellman delivers the session key over an insecure channel.'],
['A','B','AES(msg) + HMAC','The message is encrypted with the fast symmetric session key and sent with the HMAC.'],
['B','B','recompute and compare','Receiver recomputes the HMAC. Match = untampered and from someone holding the secret.'],
['M','B','forged message','Attacker has no secret key, so the HMAC does not match: message discarded.']],

{id:'pki',t:'4 · PKI & certificates',d:'PKI publishes public keys and binds them to identities through certificates signed by a Certificate Authority, organised in a hierarchy of trust (root CA at the top).',
n:[['O','Organisation',80,130],['R','RA',300,240],['C','CA',400,40],['T','Root CA',720,40],['B','Browser',720,200]],
s:[['O','O','generate key pair','Owner makes a public/private pair and keeps the private key secret.'],
['O','R','CSR + identity proof','Certificate request with the public key; the Registration Authority checks the requester identity (calls, documents).'],
['R','C','identity confirmed','RA vouches for the requester to the CA.'],
['C','O','signed X.509 cert','CA issues a certificate binding identity to public key: serial no., validity period, issuer, digital signature.'],
['O','B','present certificate','Website sends its certificate when the browser connects.'],

app:['HTTPS websites, code signing','Government eID and e-passports','Military PKI (CAC cards), banking, enterprise Wi-Fi/VPN']},

{id:'wot',t:'5 · Web of trust (PGP)',d:'Decentralised alternative to CAs, proposed by Phil Zimmermann (1992). Peers vouch for each other public keys.',
n:[['A','Alex',90,130],['S','Sam',400,40],['Z','Zach',710,130],['E','Fake key',400,240,1]],
s:[['A','S','Alex trusts Sam','Alex already knows and trusts Sam key.'],
['S','Z','Sam signs Zach key','Sam has verified Zach in person and signed his public key.'],
['S','A','Sam vouches','Sam tells Alex: this really is Zach key. Trust is transitive through the web.'],
['A','Z','encrypt with Zach pub','Only Zach private key can decrypt: confidentiality.'],
['E','A','spoofed key','A fake Zach key has no trusted signatures, so Alex rejects it.']],
pro:['No central authority or fees','Fault-tolerant; users can link several webs'],con:['Hard to scale; needs user effort','Trust decisions are subjective','Revocation is hard'],
app:['PGP / GnuPG / OpenPGP email','Open-source package signing (Linux)','Journalists, activists, developer communities']},

{id:'ips',t:'6 · IPsec',d:'Suite securing IP with authentication and encryption (mandatory in IPv6). Components: IKE/ISAKMP, SA, AH, ESP; modes: tunnel (default) and transport.',
n:[['H','Host A',50,130],['G','Gateway 1',260,130],['K','Gateway 2',540,130],['J','Host B',750,130]],
s:[['G','K','IKE Phase 1','Peers authenticate with shared secret, certificates or nonce-based revised public-key mode, creating a temporary SA and secure channel.'],
['G','K','IKE Phase 2','Inside that tunnel they negotiate IPsec SAs. An SA is one-way, so two SAs are needed for two-way traffic.'],
['H','G','plain IP packet','Host sends ordinary traffic to its gateway.'],
['G','G','encapsulate (tunnel)','Tunnel mode: entire packet plus header becomes the payload of a new IP packet.'],
['G','K','ESP: SPI+seq | enc | auth','ESP header (SA id, sequence no.), encrypted payload (symmetric, IV), trailer/padding, integrity value.'],
['G','K','AH: hash + seq','AH variant gives integrity and anti-replay only (no encryption). Sequence numbers thwart replay.'],
['G','K','NAT-T UDP 4500','NAT changes IP headers (seen as attack), so IPsec is wrapped in UDP 4500.'],
['K','J','decrypt + verify','Gateway verifies, decrypts and delivers. Transport mode (Host A to B directly) protects only the payload; HAIPE devices harden this for military use.']],

app:['Site-to-site VPNs between firewalls','Military and government links (HAIPE)','Rail, air, emergency services CCTV/telemetry','Remote workers (L2TP/IPsec)']},

['I','G','L2TP UDP 1701 → LNS','LAC encapsulates PPP into L2TP and forwards to the LNS, which authenticates the user. L2TP has no encryption.'],

{id:'ste',t:'8 · Steganography & null cipher',d:'Cryptography protects the contents of a message; steganography hides its existence. A null cipher hides it inside ordinary plaintext. Try the live demos below the stage.',
x:'ste',n:[['S','Sender',90,130],['C','Cover file',400,130],['R','Receiver',710,130],['W','Warden',400,240,1]],

['W','C','nothing suspicious','Observer sees only an ordinary picture.'],

['S','R','null cipher','Words carry the message: take the first letter of each word of an innocent sentence.']],

{id:'key',t:'9 · Key management lifecycle',d:'Most cryptosystems fail through key management, not algorithms. Kerckhoffs/Shannon: security rests on the key, not on secrecy of the algorithm.',
x:'key',n:[['G','RNG / generator',70,130],['K','KMS / HSM',250,130],['U','Users',430,130],['A','Archive',600,130],['X','Destroy',750,130]],

['K','K','wrap with KEK','Key-encrypting key wraps session keys; each record signed/MACed; keys stored in HSM, smart card or split.'],
['K','U','distribute','Diffie-Hellman, certificates or courier, protected against MITM. XKMS: X-KISS locates/validates keys, X-KRSS registers/recovers.'],
['U','U','use within cryptoperiod','Keys expire (see table): short periods limit exposure, but too-frequent manual rekeying invites errors.'],
['K','A','backup / archive','Back up root keys, allow recovery, keep key history for old backups, audits and litigation.'],
['A','X','revoke / destroy','Retire expired or compromised keys; keep verify-only copies to validate old signatures; wipe securely.']],
pro:['Central control, audit, rotation','Limits damage from compromise','Meets compliance'],con:['Single point of failure (vault/HSM)','Human error, cost, complexity','Maturity path: unmanaged → password vault → enterprise KMS'],
app:['Cloud KMS (AWS, Azure, Google)','HSMs in banks and payment networks','Military key loading devices','Enterprise PKI, database encryption']},

{id:'lim',t:'10 · Limitations & vulnerabilities',d:'Layering protocols on protocols raises complexity. Limits: computation, key management, human factors. Vulnerabilities: cryptanalysis, implementation errors, protocol flaws.',
n:[['A','Cryptanalyst',90,40,1],['H','Humans',90,220],['D','Developers',710,40],['S','Crypto system',400,130],['P','Protocol attacker',710,220,1]],

['S','S','computational cost','Bigger keys = slower, more memory and power.'],
['S','S','key management','Loss, theft, rotation and revocation mistakes (even Enigma fell to discarded keys).']],

];
